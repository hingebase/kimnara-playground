[build-system]
requires = ["maturin >=1.10.0"]
build-backend = "maturin"

[project]
name = "kimnara-playground-builder"
version = "0.0.3"
requires-python = ">=3.14"
dependencies = [
    "minijinja >=2.15.1",

    # https://github.com/compiler-explorer/compiler-explorer/blob/main/.minimum-node-version
    "nodejs-wheel >=22.12.0",

    "packaging >=26.0.0",
    "py-rattler >=0.22.0",
]
dynamic = ["license", "urls"]

[[project.authors]]
name = "hingebase"
email = "zcliu@pku.edu.cn"

[tool.maturin]
module-name = "kimnara_playground_builder._env"
