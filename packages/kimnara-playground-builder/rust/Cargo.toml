[package]
name = "kimnara-playground-builder"
version = "0.0.2"
edition = "2024"
rust-version = "1.99"
homepage = "https://github.com/hingebase/kimnara-playground"
repository = "https://github.com/hingebase/kimnara-playground/tree/main/packages/kimnara-playground-builder"
license = "Apache-2.0"
publish = false

[lib]
name = "_env"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
pyo3 = "0.29.2"
rattler_conda_types = { version = "0.48.1", default-features = false }
rattler_lock = { version = "=0.31.5", default-features = false }
rattler_shell = { version = "=0.27.10", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"

[build-dependencies]
pyo3-build-config = "0.29.2"
