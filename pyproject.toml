[tool.basedpyright]
failOnWarnings = true
ignore = ["compiler-explorer"]
reportUnnecessaryTypeIgnoreComment = "warning"
strict = ["packages"]
typeCheckingMode = "off"

[tool.pyrefly]
preset = "strict"

[tool.ruff]
line-length = 79
preview = true
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ty.rules]
all = "error"
